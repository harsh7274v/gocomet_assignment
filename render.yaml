services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend (Web Service with WebSockets + Worker)
  # -------------------------------------------------------------
  - type: web
    name: gocomet-auction-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gocomet-auction-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # -------------------------------------------------------------
  # 2. React Frontend (Static Site on Global CDN)
  # -------------------------------------------------------------
  - type: web
    name: gocomet-auction-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gocomet-auction-backend
          property: host

# -------------------------------------------------------------
# 3. Built-in PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: gocomet-auction-postgres
    databaseName: rfq_auction
    user: rfq_admin
    plan: free

