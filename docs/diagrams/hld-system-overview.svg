<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">British Auction in RFQ — system overview</title>
  <desc id="desc">Four-layer architecture: client presentation, API gateway, business engines, and database storage.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfbfa"/>
      <stop offset="100%" stop-color="#f1f1ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#141413" flood-opacity="0.07"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#141413" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8c89"/>
    </marker>
    <style>
      text { font-family: "Inter", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #141413; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #5a5a58; }
      .tiny { font-size: 12px; }
      .small { font-size: 13px; }
      .body { font-size: 14px; }
      .card-title { font-size: 17px; font-weight: 700; }
      .layer-title { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .layer-num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .group-title { font-size: 13px; font-weight: 700; letter-spacing: 0.7px; }
      .table-name { font-size: 14px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="62" font-size="30" font-weight="800" letter-spacing="-0.6">British Auction in RFQ — System Overview</text>
  <text x="60" y="92" class="body muted">Layered HLD for a real-time reverse procurement platform with automatic extensions and a forced close ceiling.</text>
  <g>
    <rect x="1378" y="40" width="362" height="34" rx="17" fill="#141413"/>
    <circle cx="1399" cy="57" r="5" fill="#4ade80"/>
    <text x="1413" y="62" class="small" fill="#ffffff" font-weight="600">FastAPI · React · WebSockets · SQL</text>
  </g>
  <line x1="60" y1="112" x2="1740" y2="112" stroke="#dededb" stroke-width="1"/>

  <!-- Layer 1: Client -->
  <rect x="60" y="125" width="1680" height="170" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <g>
    <circle cx="88" cy="153" r="11" fill="#2563eb"/>
    <text x="88" y="157.5" class="layer-num" text-anchor="middle">1</text>
    <text x="108" y="158" class="layer-title" fill="#1d4ed8">CLIENT PRESENTATION LAYER</text>
    <text x="1712" y="157" class="small muted" text-anchor="end">React 18 · TypeScript · Tailwind · Zod · Lenis</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="85" y="176" width="620" height="94" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <rect x="85" y="176" width="5" height="94" rx="2.5" fill="#2563eb"/>
  </g>
  <text x="110" y="203" class="card-title">Enterprise Buyer Studio</text>
  <text x="110" y="228" class="body muted">• Create RFQs with target-budget slider</text>
  <text x="110" y="249" class="body muted">• Live reverse-auction leaderboard</text>
  <text x="420" y="228" class="body muted">• Cancel auction + audit trail</text>
  <text x="420" y="249" class="body muted">• Zod timing &amp; budget refinements</text>

  <g filter="url(#softShadow)">
    <rect x="725" y="176" width="620" height="94" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
    <rect x="725" y="176" width="5" height="94" rx="2.5" fill="#2563eb"/>
  </g>
  <text x="750" y="203" class="card-title">Carrier Bidding Terminal</text>
  <text x="750" y="228" class="body muted">• Itemized quote entry</text>
  <text x="750" y="249" class="body muted">• L1–L3 win-probability guidance</text>
  <text x="1060" y="228" class="body muted">• Dual close / forced-cap timers</text>
  <text x="1060" y="249" class="body muted">• Live activity log &amp; outbid alerts</text>

  <g filter="url(#softShadow)">
    <rect x="1365" y="176" width="347" height="94" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  </g>
  <text x="1388" y="203" class="card-title">Shared client runtime</text>
  <text x="1388" y="228" class="body muted">• Zod validation at the edge</text>
  <text x="1388" y="249" class="body muted">• WebSocket hooks + reconnect</text>

  <!-- Layer arrows -->
  <line x1="900" y1="295" x2="900" y2="336" stroke="#8c8c89" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="916" y="320" class="small muted">HTTP requests + WebSocket stream</text>

  <!-- Layer 2: Gateway -->
  <rect x="60" y="340" width="1680" height="160" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#shadow)"/>
  <g>
    <circle cx="88" cy="368" r="11" fill="#7c3aed"/>
    <text x="88" y="372.5" class="layer-num" text-anchor="middle">2</text>
    <text x="108" y="373" class="layer-title" fill="#6d28d9">API GATEWAY &amp; TRANSPORT LAYER</text>
    <text x="1712" y="372" class="small muted" text-anchor="end">Port 8001 · JWT + RBAC</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="85" y="391" width="800" height="94" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
    <rect x="85" y="391" width="5" height="94" rx="2.5" fill="#7c3aed"/>
  </g>
  <text x="110" y="418" class="card-title">FastAPI REST Controllers</text>
  <text x="110" y="443" class="body muted">/api/auth · /api/rfqs · /api/rfqs/{id}/bids</text>
  <text x="110" y="464" class="body muted">JWT issuance · role guards · request validation</text>

  <g filter="url(#softShadow)">
    <rect x="905" y="391" width="815" height="94" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
    <rect x="905" y="391" width="5" height="94" rx="2.5" fill="#7c3aed"/>
  </g>
  <text x="930" y="418" class="card-title">Native WebSocket Manager</text>
  <text x="930" y="443" class="body muted">/ws/auctions/{rfq_id} · room-based fan-out</text>
  <text x="930" y="464" class="body muted">live bids · ranking changes · extension &amp; cancellation events</text>

  <line x1="900" y1="500" x2="900" y2="541" stroke="#8c8c89" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="916" y="525" class="small muted">route · authorize · validate</text>

  <!-- Layer 3: Engines -->
  <rect x="60" y="545" width="1680" height="190" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <g>
    <circle cx="88" cy="573" r="11" fill="#d97706"/>
    <text x="88" y="577.5" class="layer-num" text-anchor="middle">3</text>
    <text x="108" y="578" class="layer-title" fill="#b45309">BUSINESS &amp; AUCTION ENGINES</text>
    <text x="1712" y="577" class="small muted" text-anchor="end">Server UTC clock is authoritative</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="85" y="595" width="520" height="115" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
  </g>
  <text x="110" y="622" class="card-title">AuctionEngine</text>
  <text x="110" y="648" class="body muted">• UTC milestone clock</text>
  <text x="110" y="670" class="body muted">• Server-side totals + budget ceiling</text>
  <text x="110" y="692" class="body muted">• Lifecycle transitions + cancellation</text>

  <g filter="url(#softShadow)">
    <rect x="635" y="595" width="520" height="115" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
  </g>
  <text x="660" y="622" class="card-title">RankingService</text>
  <text x="660" y="648" class="body muted">• Sort ascending by total amount</text>
  <text x="660" y="670" class="body muted">• Tie-break by earliest submission</text>
  <text x="660" y="692" class="body muted">• Assign L1, L2, L3 …</text>

  <g filter="url(#softShadow)">
    <rect x="1185" y="595" width="520" height="115" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
  </g>
  <text x="1210" y="622" class="card-title">ExtensionService</text>
  <text x="1210" y="648" class="body muted">• Trigger A / B / C inside X-min window</text>
  <text x="1210" y="670" class="body muted">• Proposed close = current close + Y min</text>
  <text x="1210" y="692" class="body muted">• Clamp to forced close ceiling</text>

  <line x1="900" y1="735" x2="900" y2="776" stroke="#8c8c89" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="916" y="760" class="small muted">SQL / ORM reads &amp; writes</text>

  <!-- Layer 4: Data -->
  <rect x="60" y="780" width="1680" height="255" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
  <g>
    <circle cx="88" cy="808" r="11" fill="#059669"/>
    <text x="88" y="812.5" class="layer-num" text-anchor="middle">4</text>
    <text x="108" y="813" class="layer-title" fill="#047857">PERSISTENCE &amp; STORAGE LAYER</text>
    <text x="1712" y="812" class="small muted" text-anchor="end">SQLite (dev) · PostgreSQL (prod)</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="85" y="832" width="470" height="181" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  </g>
  <text x="108" y="858" class="group-title" fill="#047857">IDENTITY &amp; ACCESS</text>
  <rect x="106" y="870" width="428" height="34" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="118" y="892" class="table-name mono">users</text>
  <text x="200" y="892" class="small muted mono">PK id · email UK · role</text>
  <rect x="106" y="912" width="428" height="34" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="118" y="934" class="table-name mono">supplier_profiles</text>
  <text x="300" y="934" class="small muted mono">FK user_id · carrier_name</text>
  <text x="106" y="975" class="small muted">Buyers create RFQs; suppliers own carrier profiles.</text>

  <g filter="url(#softShadow)">
    <rect x="585" y="832" width="560" height="181" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  </g>
  <text x="608" y="858" class="group-title" fill="#047857">TENDERS &amp; RULES</text>
  <rect x="606" y="870" width="518" height="34" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="618" y="892" class="table-name mono">rfqs</text>
  <text x="690" y="892" class="small muted mono">PK id · buyer_id FK · status · close timestamps</text>
  <rect x="606" y="912" width="518" height="34" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="618" y="934" class="table-name mono">auction_configurations</text>
  <text x="830" y="934" class="small muted mono">FK rfq_id · X · Y · trigger</text>
  <text x="606" y="975" class="small muted">Each RFQ owns one extension rule configuration.</text>

  <g filter="url(#softShadow)">
    <rect x="1175" y="832" width="530" height="181" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2"/>
  </g>
  <text x="1198" y="858" class="group-title" fill="#047857">QUOTES, INVITES &amp; AUDIT</text>
  <rect x="1196" y="870" width="488" height="28" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="1208" y="889" class="table-name mono">rfq_invitations</text>
  <text x="1345" y="889" class="small muted mono">FK rfq_id · supplier_id · status</text>
  <rect x="1196" y="904" width="488" height="28" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="1208" y="923" class="table-name mono">bids</text>
  <text x="1270" y="923" class="small muted mono">FK rfq_id · supplier_id · total_amount · submitted_at</text>
  <rect x="1196" y="938" width="488" height="28" rx="8" fill="#f0fdf4" stroke="#d1fae5"/>
  <text x="1208" y="957" class="table-name mono">activity_logs</text>
  <text x="1320" y="957" class="small muted mono">FK rfq_id · actor_id · event_type</text>
  <text x="1196" y="993" class="small muted">Immutable audit trail for every bid, rank shift, and extension.</text>

  <!-- Footer -->
  <line x1="60" y1="1053" x2="1740" y2="1053" stroke="#dededb" stroke-width="1"/>
  <text x="60" y="1072" class="tiny muted">Generated from docs/SIMPLE_HLD.md · 1800 × 1080 · Source: docs/diagrams/source/hld-system-overview.svg</text>
  <text x="1740" y="1072" class="tiny muted" text-anchor="end">gocomet_assignment · Design Atlas</text>
</svg>
